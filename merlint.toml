# Utility parsers are intentionally expressed as large Tailwind class matchers.
max-complexity = 43
max-nesting = 9

allowed_words = [
  "base_to_style",
  "bracket_color_to_custom",
  "candidates_from_file",
  "color_to_string",
  "config_to_string",
  "container_query_to_condition",
  "css_color_to_hex",
  "custom_color_to_oklab",
  "dedup_keyframes_to_css",
  "extract_breakpoints_from_css",
  "extract_radius_from_css",
  "extract_spacing_from_css",
  "filter_theme_from_statements",
  "hex_to_rgb",
  "indexed_rule_to_statement",
  "margin_to_length",
  "oklch_to_css",
  "oklch_to_rgb",
  "opacity_to_percent",
  "rgb_to_hex",
  "rgb_to_oklab",
  "rgb_to_oklch",
  "rule_to_triple",
  "set_var_names_from_props",
  "test_modifier_to_rule",
  "test_rgb_to_hex",
  "test_to_tw",
  "to_class",
  "to_classes",
  "to_color",
  "to_css",
  "to_name",
]

# The local checkout uses an untracked symlink to the sibling cascade repo for
# development, and vendored dev tooling under mono/. Neither is part of this
# package's lint surface.
[[rules]]
files = ["cascade/**", "./cascade/**", "mono/**", "./mono/**"]
exclude = ["*"]

# MDX loads preludes into its toplevel runner at runtime; dune deliberately
# compiles no unit or typedtree for them. They therefore have no merlint rule
# surface. Excluding them wholesale also keeps them out of merlint's unchecked
# count once samoht/merlint#6 is available.
[[rules]]
files = [
  "docs/mdx/prelude.ml",
  "lib/mdx/prelude.ml",
  "lib/dom/mdx/prelude.ml",
]
exclude = ["*"]

# tw.ml includes each utility module, so a module's public names are the
# top-level Tw names: Cursor.cursor_pointer is Tw.cursor_pointer, which is
# the Tailwind class it emits. Only these modules name values after
# themselves; the rest are under E330.
[[rules]]
files = [
  "lib/color.ml*",
  "lib/columns.ml*",
  "lib/contain.ml*",
  "lib/cursor.ml*",
  "lib/divide.ml*",
  "lib/field_sizing.ml*",
  "lib/flex.ml*",
  "lib/gap.ml*",
  "lib/grid.ml*",
  "lib/overflow.ml*",
  "lib/overscroll.ml*",
  "lib/prose.ml*",
  "lib/scroll.ml*",
  "lib/style.ml*",
  "lib/tab.ml*",
  "lib/text_shadow.ml*",
  "lib/touch.ml*",
]
exclude = ["E330"]
