name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: OCaml ${{ matrix.ocaml-compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - "5.2"
          - "5.4"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Tailwind CLI for example comparisons
        # Exact versions come from package-lock.json: the examples are
        # byte-compared against this Tailwind release, and a different one
        # shifts output (units, calc folding, palette rounding).
        run: npm ci

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

      # dune runtest leaves the upstream parity runner's canonicalization
      # tolerance in place. Running it again with the tolerance off means a
      # case that starts leaning on it fails under its own name here, instead
      # of passing quietly on the way through.
      - name: Upstream parity without the canonicalization tolerance
        env:
          TW_UPSTREAM_STRICT: 1
        run: opam exec -- dune exec test/upstream/test.exe

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      # Reads the pinned version from .ocamlformat and runs dune build @fmt.
      - uses: ocaml/setup-ocaml/lint-fmt@v3
