name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: OCaml ${{ matrix.ocaml-compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - "5.2"
          - "5.4"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Tailwind CLI for example comparisons
        # Exact versions come from package-lock.json: the examples are
        # byte-compared against this Tailwind release, and a different one
        # shifts output (units, calc folding, palette rounding).
        run: npm ci

      # test/helpers/test_helpers.ml loads both sheets in headless Chromium and
      # compares computed styles. npm ci installs the Playwright package but not
      # the browser it drives, and the check skips silently when it cannot
      # launch one, so without this step eight suites report no rendering
      # differences because they never looked.
      - name: Install the Chromium the rendering comparison drives
        run: npx playwright install --with-deps chromium

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # dune-project asks for cascade 1.2.0 and that release does not exist
      # yet. Pin the tested development revision: following main made an
      # unchanged PR start compiling against breaking API changes.
      - name: Pin the tested cascade revision
        run: opam pin add --no-action -y cascade.1.2.0 git+https://github.com/samoht/cascade.git#e829b2d629fe210a23415a218f1814d2abc0c1ad

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        # TW_BROWSER_TESTS=1 turns a missing browser into a failure, so the
        # rendering comparison cannot go back to passing by not running.
        # TW_TAILWIND_TESTS=1 does the same for the Tailwind CLI: without it a
        # missing CLI, or one whose version no longer matches the pin, retires
        # the parity half of the suite into skips that dune swallows on
        # success, so a lockfile bump would disable it unnoticed. The
        # whole-sheet order gate takes its oracle from that same CLI.
        env:
          TW_BROWSER_TESTS: 1
          TW_TAILWIND_TESTS: 1
        run: opam exec -- dune runtest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      # Reads the pinned version from .ocamlformat and runs dune build @fmt.
      - uses: ocaml/setup-ocaml/lint-fmt@v3
