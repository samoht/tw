name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: OCaml ${{ matrix.ocaml-compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - "5.2"
          - "5.4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tailwind CLI for example comparisons
        # Exact versions come from package-lock.json: the examples are
        # byte-compared against this Tailwind release, and a different one
        # shifts output (units, calc folding, palette rounding).
        run: npm ci

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Make Cascade 1.1.0 available before opam publication
        run: |
          if ! opam show cascade.1.1.0 >/dev/null 2>&1; then
            opam pin add -n cascade.1.1.0 \
              https://github.com/samoht/cascade.git#1.1.0
          fi

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest
